name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required repository files
        run: |
          test -f README.md
          test -f .claude-plugin/marketplace.json
          test -f scripts/publish-skill.sh
          test -d skills

      - name: Verify every skill has SKILL.md and .clawhubignore
        run: |
          for dir in skills/*; do
            [ -d "$dir" ] || continue
            test -f "$dir/SKILL.md"
            test -f "$dir/.clawhubignore"
          done

