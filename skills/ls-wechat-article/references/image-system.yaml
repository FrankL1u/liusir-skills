subject_constraints: >
  禁止写实人物、真实脸部、真实手部和真人肖像式构图。
  允许非写实角色，只在确有表达需要时使用，例如漫画人物、
  玩具化角色、图标化角色、黏土风角色。优先使用结构、符号、
  图标、模块、物体关系来表达观点，而不是人物表演。

cover_types:
  - key: "hero"
    zh: "主视觉"
    description: "单一强主体，适合封面第一眼识别。"
  - key: "conceptual"
    zh: "概念主视觉"
    description: "用一个核心隐喻表达文章判断。"
  - key: "typography"
    zh: "字标题海报"
    description: "以标题和版式为主，图像辅助。"
  - key: "metaphor"
    zh: "隐喻封面"
    description: "用物体关系或视觉隐喻表达主题。"
  - key: "scene"
    zh: "场景封面"
    description: "以一个工作或叙事场景定调。"
  - key: "minimal"
    zh: "极简封面"
    description: "留白和单一元素为主。"

inline_types:
  - key: "infographic"
    zh: "信息图"
    description: "数据、指标、模块摘要。"
  - key: "scene"
    zh: "场景图"
    description: "氛围插图、叙事段落配图。"
  - key: "flowchart"
    zh: "流程图"
    description: "步骤、链路、工作流。"
  - key: "comparison"
    zh: "对比图"
    description: "并排比较、前后差异。"
  - key: "framework"
    zh: "框架图"
    description: "概念关系、系统结构、方法论。"
  - key: "timeline"
    zh: "时间线"
    description: "进展、演化、阶段变化。"

styles:
  - key: "notion"
    zh: "极简手绘线条风"
    aliases: ["notion-like", "sketch notes"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["conceptual", "minimal"]
    inline_types: ["framework", "flowchart", "comparison"]
    notes: "适合知识分享、SaaS、生产力、轻结构化解释。"
  - key: "warm"
    zh: "温暖亲和风"
    aliases: ["warm friendly", "friendly warm"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["scene", "metaphor"]
    inline_types: ["scene", "comparison"]
    notes: "适合个人叙事、轻解释、带人味但不写实。"
  - key: "blueprint"
    zh: "技术蓝图风"
    aliases: ["modern tech high contrast", "high contrast tech", "modern workflow system"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["conceptual", "hero"]
    inline_types: ["framework", "flowchart", "comparison"]
    notes: "适合架构、系统设计、Agent 工作流、工程主题。"
  - key: "watercolor"
    zh: "水彩柔和风"
    aliases: ["soft watercolor"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["scene", "metaphor"]
    inline_types: ["scene", "framework"]
    notes: "适合柔和叙事、创意表达、非硬核技术文章。"
  - key: "editorial"
    zh: "杂志信息图风"
    aliases: ["clean editorial tech", "clean editorial tech illustration", "editorial tech"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["conceptual", "metaphor", "hero"]
    inline_types: ["framework", "comparison", "flowchart", "infographic"]
    notes: "适合方法论、趋势判断、工具分析。"
  - key: "scientific"
    zh: "学术精确图表风"
    aliases: ["scientific diagram", "precise chart"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["conceptual"]
    inline_types: ["framework", "flowchart", "comparison", "infographic"]
    notes: "适合严谨分析、结构化拆解、图表化表达。"
  - key: "lofi-doodle"
    zh: "低保真手绘涂鸦风"
    aliases: ["lofi doodle", "doodle"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["conceptual", "metaphor"]
    inline_types: ["framework", "flowchart", "comparison"]
    notes: "适合白板感、脑图感、思路草稿式表达。"
  - key: "multi-panel-manga"
    zh: "多格漫画说明风"
    aliases: ["multi panel manga", "manga explainer"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["scene", "hero"]
    inline_types: ["scene", "timeline", "flowchart"]
    notes: "适合教程、过程推进、工具使用演示、轻叙事。"
  - key: "notebook-sketch"
    zh: "笔记本草图概念风"
    aliases: ["notebook sketch", "concept sketch"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["conceptual", "metaphor"]
    inline_types: ["framework", "flowchart", "scene"]
    notes: "适合概念速写、控制论、系统隐喻、工作流结构。"
  - key: "claymation"
    zh: "黏土定格玩具风"
    aliases: ["clay", "stop motion clay"]
    use_for_cover: true
    use_for_inline: true
    cover_types: ["scene", "metaphor"]
    inline_types: ["scene", "comparison", "timeline"]
    notes: "适合降低技术门槛的解释类内容。"
