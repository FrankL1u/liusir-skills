interface:
  display_name: "LS WeChat Article"
  short_description: "Write, format, preview, and publish WeChat articles"
  default_prompt: "Use $ls-wechat-article to turn a topic, brief, or Markdown draft into a WeChat Official Account article, then preview or publish it with the toolkit. Before drafting a new article, first search for the latest related news, releases, examples, or market context. If TrendRadar is configured, prefer it for fresh topic signals; otherwise use general search or direct sources. Do not write a 'latest', 'trend', or current-state article purely from prior knowledge. This freshness requirement applies to drafting, not to format-only or publish-only flows. After drafting, run Step 4.5 editorial QA, write quality-report.md, and report repair suggestions without revising unless the user asks. Before Step 5 image generation, read style.yaml.visuals. If it is missing, ask for the complete first-run visual configuration: scope, style, palette, cover type, cover mood, cover font, cover text level, cover aspect, inline density, and inline type default. If the user skips or leaves a field unset, use the default from references/visual-prompt-system.md, then initialize visuals. Step 5 generates the cover; Step 5.5 generates inline images. If the user changes visual settings for this run, ask whether to write them back for next time. Before Step 6 preview or publish, ask for a theme choice or explicitly tell the user which theme will be used."
